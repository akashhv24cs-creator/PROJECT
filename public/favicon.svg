<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A05A"/>
      <stop offset="100%" stop-color="#E87B2C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E87B2C" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#E87B2C" stroke-width="6" stroke-opacity="0.25"/>
  
  <!-- Stylized "Z" Monogram & Road/Pin Accent -->
  <g filter="url(#glow)">
    <!-- Top Bar of Z -->
    <path d="M120 148 H392 C402 148 408 158 402 168 L200 364 H392 C404 364 412 374 412 386 C412 398 404 408 392 408 H120 C110 408 104 398 110 388 L312 192 H120 C108 192 100 182 100 170 C100 158 108 148 120 148 Z" fill="url(#orangeGrad)"/>
    
    <!-- Pulse Travel Pin Dot -->
    <circle cx="392" cy="148" r="28" fill="#F4A05A"/>
    <circle cx="392" cy="148" r="14" fill="#1A1A1A"/>
  </g>
</svg>
